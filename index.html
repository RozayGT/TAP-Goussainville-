const AGC=['#ff6b6b','#ffa94d','#4dabf7','#9775fa','#20c997','#f06595','#fab005','#15aabf','#82c91e','#e64980'];
const AG=[['a0','HOUDAIFA Allan','hmt3','REq'],['a1','ROULLEAU Antony','hmt3'],['a2','GONCALVES FRASCO José','hmt3'],['a3','SOLARZ Christophe','hmt3'],['a4','SIME SANDJON Ethane'],['a5','DUPARC Jimmy']];
const HOL=['2027-01-01','2027-03-29','2027-05-01','2027-05-06','2027-05-08','2027-05-17','2027-07-14','2027-08-15','2027-11-01','2027-11-11','2027-12-25','2028-01-01','2028-04-17','2028-05-01','2028-05-08','2028-05-25','2028-06-05','2028-07-14','2028-08-15','2028-11-01','2028-11-11','2028-12-25'];
const MOIS=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'],JS=['Di','Lu','Ma','Me','Je','Ve','Sa'];
let YR=2027;const CY=new Date().getFullYear();if(CY===2027||CY===2028)YR=CY;else if(CY>2028)YR=2028;else{try{YR=+localStorage.getItem('tap_yr')||2027}catch(e){}}if(YR!==2027&&YR!==2028)YR=2027;
let data={},mo=new Date().getFullYear()==YR?new Date().getMonth():0,vw='plan',sel=null,line=0,db=null,ro=false;
const iso=(m,d)=>`${YR}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function get(a,k){const v=(data[a]||{})[k];if(v)return v;if(HOL.includes(k))return['F',''];const w=new Date(k+'T12:00').getDay();return w==0||w==6?['RP','']:['',''];}
function chip(c,cls,a,k,l){const kc=c&&kcOf(c,a),hn=kc&&NU[wkey(wkS(k))+'|'+kc]?' hn':'';const h=`data-s="${a}|${k}|${l}" onclick="openS('${a}','${k}',${l})"`;if(!c)return`<span class="${cls} e" ${h}></span>`;const p=P[c]||['#ddd','#000'];return`<span class="${cls}${hn} k${c}" ${h} style="background:${p[0]};color:${p[1]}">${c}</span>`}
function name(a){return esc(a[1])+(a[2]?` <span class="h3">(${a[2]})</span>`:'')+(a[3]?`<span class="rq">(${a[3]})</span>`:'')}
function ctrTab(){const t=$('tabs'),on=t&&t.querySelector('button.on');if(on&&t.scrollWidth>t.clientWidth){t.scrollLeft=on.offsetLeft-(t.clientWidth-on.offsetWidth)/2}}
function tabs(){setTimeout(ctrTab,0);$('tabs').style.display=vw==='year'?'none':'';$('tabs').innerHTML=MOIS.map((m,i)=>`<button class="${i==mo?'on':''}" onclick="mo=${i};draw()">${m.slice(0,4)}${m.length>4?'.':''}</button>`).join('');$('view').innerHTML=[['plan','Planning'],['year','Mon année'],['cnt','Compteurs'],['leg','Légende']].map(([k,l])=>`<button class="${vw==k?'on':''}" onclick="vw='${k}';draw()">${l}</button>`).join('')}
const VAC={B:[['2026-12-19','2027-01-03'],['2027-02-20','2027-03-07'],['2027-04-17','2027-05-02'],['2027-07-03','2027-08-31'],['2027-10-23','2027-11-07'],['2027-12-18','2028-01-02'],['2028-02-05','2028-02-20'],['2028-04-08','2028-04-23'],['2028-07-05','2028-08-31']],
C:[['2026-12-19','2027-01-03'],['2027-02-06','2027-02-21'],['2027-04-03','2027-04-18'],['2027-07-03','2027-08-31'],['2027-10-23','2027-11-07'],['2027-12-18','2028-01-02'],['2028-02-12','2028-02-27'],['2028-04-15','2028-05-01'],['2028-07-05','2028-08-31']]};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function isoW(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)}
function vacW(d){const n=d.getDay()||7,mon=new Date(d);mon.setDate(d.getDate()-n+1);const z=[];for(const k of['B','C']){for(let i=0;i<5;i++){const x=new Date(mon);x.setDate(mon.getDate()+i);const s=ymd(x);if(VAC[k].some(([a,b])=>s>=a&&s<=b)){z.push(k);break}}}return z}
let HL=false;try{HL=localStorage.getItem('tap_hl')==='1'}catch(e){}
function tgHL(){if(!me){who();return}HL=!HL;try{localStorage.setItem('tap_hl',HL?'1':'0')}catch(e){}draw()}
function hlB(){const b=$('hlb');if(b)b.classList.toggle('on',HL)}

let NT={};try{NT=JSON.parse(localStorage.getItem('tap_notes')||'{}')}catch(e){}
function saveNote(){const[a,k]=sel,t=($('nti').value||'').trim(),key=a+'|'+k;if((NT[key]||'')===t)return;if(t)NT[key]=t;else delete NT[key];
 try{localStorage.setItem('tap_notes',JSON.stringify(NT))}catch(e){}if(RT)RT.ref('notes/'+a+'/'+k).set(t||null).catch(()=>{});draw();markS();$('ntb').textContent=t?'✓ Note enregistrée':'Note supprimée'}
let NU={};try{NU=JSON.parse(localStorage.getItem('tap_nuits')||'{}')}catch(e){}
const NC=['N1','N2','N3','N4'];
const kcOf=(c,a)=>NC.includes(c)?c:(c==='FOR'?'FOR_'+a:null),isF=kc=>kc.startsWith('FOR_'),kLab=kc=>isF(kc)?'FOR':kc;
const kChip=kc=>isF(kc)?`<span class="cd" style="background:#ffff69;color:#5c5c00">FOR</span><span class="cd ini">${iniA(kc.slice(4))}</span>`:`<span class="cd">${kc}</span>`;
function wkey(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);return t.getUTCFullYear()+'-W'+String(isoW(d)).padStart(2,'0')}
const wkS=k=>new Date(k+'T12:00'),wnum=w=>'S'+(+w.split('-W')[1]);
let NQ=null;
function openN(wks,code,ask){NQ={wks,code};const cur=NU[wks[0]+'|'+code]||'',f=isF(code),S=wks.map(wnum).join(', ');
 $('ndt').innerHTML=kChip(code)+(f?' Formation':' Chantier de nuit');
 $('ndp').textContent=f?(ask?'Quelle formation pour ':'Formation de ')+pre(code.slice(4))+' en '+S+' ?':(ask?'Quel chantier pour ':'Chantier pour ')+code+' en '+S+' ?';
 $('ndi').placeholder=f?'ex. Habilitation électrique':'ex. Maintenance d’aiguille Orry';
 $('ndi').value=cur;$('ndd').style.display=cur?'block':'none';$('nd').style.display='flex';setTimeout(()=>$('ndi').focus(),250)}
function closeN(){$('nd').style.display='none';NQ=null}
function okN(del){if(!NQ)return;const t=del?'':$('ndi').value.trim();
 for(const w of NQ.wks){const key=w+'|'+NQ.code;if(t)NU[key]=t;else delete NU[key];if(RT)RT.ref('nuits/'+w+'/'+NQ.code).set(t||null).catch(()=>{})}
 try{localStorage.setItem('tap_nuits',JSON.stringify(NU))}catch(e){}closeN();draw()}
function wDays(k){const d=wkS(k),n=d.getDay()||7,o=[];for(let i=0;i<7;i++){const x=new Date(d);x.setDate(d.getDate()-n+1+i);o.push(ymd(x))}return o}
function used(k,kc){const ds=wDays(k);if(isF(kc)){const a=kc.slice(4);return ds.some(x=>get(a,x).includes('FOR'))}return ds.some(x=>AG.some(a=>get(a[0],x).includes(kc)))}
function cleanN(ks){const done={};for(const k of ks){const w=wkey(wkS(k));if(done[w])continue;done[w]=1;
 for(const kc of [...NC,...AG.map(a=>'FOR_'+a[0])]){if(NU[w+'|'+kc]&&!used(k,kc)){delete NU[w+'|'+kc];if(RT)RT.ref('nuits/'+w+'/'+kc).remove().catch(()=>{})}}}
 try{localStorage.setItem('tap_nuits',JSON.stringify(NU))}catch(e){}}
function nInfo(a,k){const v=get(a,k),w=wkey(wkS(k));return v.map(c=>kcOf(c,a)).filter(kc=>kc&&NU[w+'|'+kc]).map(kc=>`<div class="ninfo">${kChip(kc)}${esc(NU[w+'|'+kc])}<a onclick="closeS();openN(['${w}'],'${kc}')">Modifier</a></div>`).join('')}
function plan(){hlB();const n=new Date(YR,mo+1,0).getDate();let h='<tr class="dy"><th class="nm">'+MOIS[mo]+' '+YR+'</th>',wr='<tr class="wk"><th class="nm">Semaine</th>',days=[],cw=null,cs=0,cz=[],G=[],ck='',cf='';
const fl=()=>{if(cs)G.push([ck,cs,cf]);if(cs)wr+=`<th colspan="${cs}" class="${cz.length?'v':''}">S${cw}${cz.length&&cs>2?' · Vac. '+cz.join('+'):''}</th>`};
for(let d=1;d<=n;d++){const dt=new Date(YR,mo,d),k=iso(mo,d),w=dt.getDay(),c=HOL.includes(k)?'hol':(w%6==0?'we':''),wk=isoW(dt);
 if(wk!==cw){fl();cw=wk;cs=0;cz=vacW(dt);ck=wkey(dt);cf=k}cs++;days.push([k,c]);h+=`<th data-d="${k}" class="${c}${k===TODAY?' tdy':''}">${JS[w]}<b>${d}</b></th>`}
fl();wr+='</tr>';h+='</tr>';let b='';
const row=(lab,KS)=>{const on=(w,f,c)=>NU[w+'|'+c]&&used(f,c);if(!G.some(([w,,f])=>KS.some(c=>on(w,f,c))))return'';return`<tr class="nr"><th class="nm">${lab}</th>`+G.map(([w,n,f])=>`<td colspan="${n}"><div class="nw">${KS.filter(c=>on(w,f,c)).map(c=>`<button class="nt" onclick="openN(['${w}'],'${c}')">${kChip(c)}${n>2?`<span class="x2">${esc(NU[w+'|'+c])}</span>`:''}</button>`).join('')}</div></td>`).join('')+'</tr>'};
b+=row('🌙 Nuits',NC)+row('📚 Formations',AG.map(a=>'FOR_'+a[0]));for(const a of AG){b+=`<tr class="${HL&&me===a[0]?'mine':''}" style="--agc:${AGC[AG.indexOf(a)%AGC.length]}"><th class="nm">${name(a)}</th>`;for(const[k,c]of days){const v=get(a[0],k);b+=`<td class="c ${c}">${NT[a[0]+'|'+k]?'<span class="nb">💬</span>':''}${chip(v[0],'a',a[0],k,0)}${chip(v[1],'b',a[0],k,1)}</td>`}b+='</tr>'}
$('main').innerHTML=`<div class="wrap"><table><thead>${wr}${h}</thead><tbody>${b}</tbody></table></div>`}
function cnt(){let o='';const dk=document.documentElement.dataset.theme=='dark';
const CC={RPS:'#1fa8bf',CA:'#3b7dd8',RU:'#14a3a3',VT:'#5b6fe0',RP:'#2aa4b8',N:dk?'#8f9cff':'#3d4fb8',AST:'#00b347',RQ:'#4a7fe0'};
const ini=a=>a[1].split(' ').filter(Boolean).map((w,i,ar)=>i==0||i==ar.length-1?w[0]:'').join('').toUpperCase();
for(const a of AG){const c={};for(let m=0;m<12;m++)for(let d=1;d<=new Date(YR,m+1,0).getDate();d++)get(a[0],iso(m,d)).forEach(x=>x&&(c[x]=(c[x]||0)+1));const g=x=>c[x]||0,N=g('N1')+g('N2')+g('N3')+g('N4');
const R=(code,lab,t)=>{const v=t-g(code),p=Math.max(0,Math.min(100,v/t*100));return`<div class="tile" style="--c:${v<0?'var(--neg)':CC[code]}"><div class="tl"><i></i>${lab}</div><div class="tv ${v<0?'neg':''}">${v}<small>/ ${t}</small></div><div class="bar"><i style="width:${p}%"></i></div></div>`};
const T=(code,lab,v)=>`<div class="tile" style="--c:${CC[code]}"><div class="tl"><i></i>${lab}</div><div class="tv">${v}</div></div>`;
o+=`<div class="card"><h3><span class="av">${ini(a)}</span><span>${name(a)}</span></h3><div class="tiles">${R('CA','CA',a[0]=='a3'?20:28)}${R('RPS','RPS',10)}${R('RU','RU',8)}${a[0]=='a3'?R('VT','VT',67):''}</div><div class="tiles t4">${T('AST','AST',g('AST'))}${T('N','Nuits',N)}</div></div>`}
$('main').innerHTML=`<div class="cnt">${o}</div>`}

let yAg=null,ySel=null;
const YN={N1:'#7c8cf8',N2:'#7c8cf8',N3:'#7c8cf8',N4:'#7c8cf8',MN:'#7c8cf8'};
function yC(c){const p=P[c];if(!p)return'';return document.documentElement.dataset.theme==='dark'&&YN[c]?YN[c]:p[0]}
function year(){const yw0=document.querySelector('.ywho'),ysx=yw0?yw0.scrollLeft:0;const A=yAg||me||AG[0][0],today=ymd(new Date());const cnt={};let g='';
 for(let m=0;m<12;m++){const n=new Date(YR,m+1,0).getDate(),off=(new Date(YR,m,1).getDay()+6)%7;let c='<i class="x"></i>'.repeat(off);
  for(let d=1;d<=n;d++){const k=iso(m,d),v=get(A,k),p=yC(v[0]),q=yC(v[1]);v.forEach(x=>x&&(cnt[x]=(cnt[x]||0)+1));
   c+=`<i class="${k===today?'td ':''}${k===ySel?'sl ':''}${NT[A+'|'+k]?'hn2':''}" onclick="ySel='${k}';year()" style="${p?'background:'+p:''}">${q?`<u style="background:${q}"></u>`:''}</i>`}
  g+=`<div class="ym"><h4>${MOIS[m]}</h4><div class="yw"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div><div class="yd">${c}</div></div>`}
 const who=AG.map(a=>`<button class="${a[0]===A?'on':''}" onclick="yAg='${a[0]}';ySel=null;year()">${esc(pre(a[0]))}</button>`).join('');
 const N=['N1','N2','N3','N4'].reduce((t,c)=>t+(cnt[c]||0),0);
 const sm=[['CA','CA'],['N','Nuits'],['FOR','Formation'],['RU','RU'],['RPS','RPS'],['AST','Astreinte'],['MA','Maladie'],['RÉU','Réunion']].map(([k,l])=>{const v=k==='N'?N:(cnt[k]||0);if(!v)return'';const col=k==='N'?(document.documentElement.dataset.theme==='dark'?'#7c8cf8':'#17375e'):P[k][0];return`<span><i style="background:${col}"></i>${l} <b>${v}</b></span>`}).join('');
 let tip='';if(ySel){const v=get(A,ySel),d=wkS(ySel),w=wkey(d);const ch=v.filter(Boolean).map(c=>{const p=P[c]||['#ddd','#000'];const kc=kcOf(c,A),ds=kc&&NU[w+'|'+kc]?' · '+esc(NU[w+'|'+kc]):'';return`<span class="cd" style="background:${yC(c)||p[0]};color:${p[1]}">${esc(c)}</span>${ds}`}).join(' ');
  tip=`<div class="ytip"><div><b>${JS[d.getDay()]}. ${d.getDate()} ${MOIS[d.getMonth()].toLowerCase()}</b><div class="yc">${ch||'<span style="color:var(--mut)">Rien de posé</span>'}</div>${NT[A+'|'+ySel]?`<div class="yn">💬 ${esc(NT[A+'|'+ySel])}</div>`:''}</div><a onclick="yOpen()">Ouvrir</a></div>`}
 $('main').innerHTML=`<div class="ywho">${who}</div><div class="ysum">${sm||'<span>Aucun code posé pour le moment</span>'}</div>${tip}<div class="yg">${g}</div>`;const yw=document.querySelector('.ywho');if(yw){yw.scrollLeft=ysx;const on=yw.querySelector('.on');if(on){const r=on.offsetLeft,w=on.offsetWidth;if(r<yw.scrollLeft||r+w>yw.scrollLeft+yw.clientWidth)yw.scrollTo({left:r-(yw.clientWidth-w)/2,behavior:'smooth'})}}}
function yOpen(){const A=yAg||me||AG[0][0],k=ySel;mo=+k.slice(5,7)-1;vw='plan';draw();setTimeout(()=>{const e=document.querySelector(`[data-s="${A}|${k}|0"]`);if(e)e.scrollIntoView({block:'center',inline:'center',behavior:'smooth'});openS(A,k,0)},150)}
function leg(){$('main').innerHTML='<div class="leg">'+Object.entries(P).map(([k,p])=>`<div><span class="chip" style="background:${p[0]};color:${p[1]}">${k}</span>${p[2]}</div>`).join('')+'</div>'}
function th(t){const r=document.documentElement;if(t)r.dataset.theme=t;else delete r.dataset.theme;
const dk=t?t=='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dk?'dark':'light';
$('th').textContent=dk?'☀️':'🌙';document.querySelector('meta[name=theme-color]').content=dk?'#1e1b4b':'#a5b4fc'}
function tg(){const n=document.documentElement.dataset.theme=='dark'?'light':'dark';try{localStorage.setItem('tap_theme',n)}catch(e){}th(n);draw()}
(()=>{let t=null;try{t=localStorage.getItem('tap_theme')}catch(e){}th(t)})();

let me=null,H=[],RT=null;try{me=localStorage.getItem('tap_me')}catch(e){}
const nmA=id=>(AG.find(x=>x[0]==id)||[0,'?'])[1],pre=id=>{const p=nmA(id).split(' ');return p[p.length-1]};
const iniA=id=>{const p=nmA(id).split(' ');return(p[0][0]+p[p.length-1][0]).toUpperCase()};
function who(){$('wl').innerHTML=AG.map(a=>`<button onclick="pickMe('${a[0]}')"><span class="av">${iniA(a[0])}</span><span>${name(a)}</span></button>`).join('');$('who').style.display='flex'}

const TU=[['👋','Bienvenue sur TAP','Le planning de l’équipe, partagé en direct avec tous les collègues.'],
['📅','Naviguer','Choisissez le mois en haut, puis faites glisser le planning. En violet : les vacances scolaires. Touchez « TAP 2027 ⇄ » pour passer à 2028.'],
['✏️','Saisir un code','Touchez une case : en haut la ligne 1, en bas la ligne 2 (ex. AST sous un RP). « Jusqu’au » pose le code sur plusieurs jours. 💬 Ajoutez une note, et ↶ Annuler en cas d’erreur.'],
['🌙','Nuits et formations','À la première pose d’un N1 à N4 ou d’un FOR, l’appli demande le chantier ou la formation. Touchez l’étiquette pour la modifier.'],
['🗓️','Mon année','Toute l’année d’un agent sur un écran. Touchez un jour pour voir le détail.'],
['📊','Compteurs','Vos CA, RPS, RU restants, vos astreintes et vos nuits.'],
['🔔','Historique et options','En bas : qui a modifié quoi. En haut : ★ votre ligne en avant, 🌙 le thème, ? ce tuto, votre pastille pour changer de nom.']];
let tuI=0;
function tuto(i){tuI=i;const t=TU[i];$('tue').textContent=t[0];$('tut').textContent=t[1];$('tup').textContent=t[2];
 $('tud').innerHTML=TU.map((_,k)=>`<i class="${k==i?'on':''}"></i>`).join('');$('tuh').textContent='← Glissez ou touchez Suivant →';$('tun').textContent=i==TU.length-1?'C’est parti !':'Suivant';$('tu').style.display='flex'}
function tuNext(){tuI<TU.length-1?tuto(tuI+1):tuEnd()}
function tuPrev(){if(tuI>0)tuto(tuI-1)}
(()=>{const el=$('tu'),bx=el.querySelector('.bx');let x0=null,y0=0,dx=0;
 bx.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;x0=e.clientX;y0=e.clientY;dx=0;bx.style.transition='none';try{bx.setPointerCapture(e.pointerId)}catch(_){}});
 bx.addEventListener('pointermove',e=>{if(x0===null)return;dx=e.clientX-x0;if(Math.abs(dx)>Math.abs(e.clientY-y0))bx.style.transform=`translateX(${dx}px) rotate(${dx/40}deg)`;bx.style.opacity=1-Math.min(.5,Math.abs(dx)/600)});
 const end=()=>{if(x0===null)return;bx.style.transition='transform .2s,opacity .2s';bx.style.transform='';bx.style.opacity='';
  if(dx<-50)tuNext();else if(dx>50)tuPrev();x0=null};
 bx.addEventListener('pointerup',end);bx.addEventListener('pointercancel',end);
 el.addEventListener('click',e=>{if(e.target===el)tuEnd()});
 document.addEventListener('keydown',e=>{if(el.style.display!=='flex')return;if(e.key==='ArrowRight')tuNext();if(e.key==='ArrowLeft')tuPrev();if(e.key==='Escape')tuEnd()})})();
function tuEnd(){$('tu').style.display='none';try{localStorage.setItem('tap_tuto7','1')}catch(e){}}
