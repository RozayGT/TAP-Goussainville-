// ---- Version automatique : 1.0 au premier envoi de index.html sur GitHub, puis 1.1, 1.2... à chaque mise à jour ----
let cur=null;
function repo(){const h=location.hostname,p=location.pathname.split('/').filter(Boolean);
  if(!h.endsWith('.github.io'))return null;const o=h.replace('.github.io','');return o+'/'+(p[0]||h)}
async function nbMaj(){const r=repo();if(!r)return null;
  const res=await fetch(`https://api.github.com/repos/${r}/commits?path=index.html&per_page=1&t=${Date.now()}`,{cache:'no-store'});
  if(!res.ok)return null;const l=res.headers.get('Link')||'',m=l.match(/[?&]page=(\d+)>;\s*rel="last"/);
  return m?+m[1]:(await res.json()).length}
const vs=n=>{if(n<14)return'1.'+Math.max(0,n-1);const m=n-14;return(2+Math.floor(m/10))+'.'+(m%10)};
async function chk(){try{const n=await nbMaj();if(n===null)throw 0;
  if(cur===null){cur=n;$('ver').textContent='v'+vs(n);let o=null;try{o=localStorage.getItem('tap_vn');localStorage.setItem('tap_vn',n)}catch(e){}
    if(o&&+o<n){$('ut').textContent='Mise à jour installée : v'+vs(n);$('upd').style.display='flex';setTimeout(()=>$('upd').style.display='none',4000)}}
  else if(n>cur){$('ut').textContent='Nouvelle version v'+vs(n)+' disponible';$('upd').style.display='flex'}}
 catch(e){try{const o=localStorage.getItem('tap_vn');if(o&&cur===null)$('ver').textContent='v'+vs(+o)}catch(_){}}}
