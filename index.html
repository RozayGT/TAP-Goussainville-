<script>
const P={CA:['#8cb4e5','#1f2a44','Congés annuel'],RU:['#bcdeed','#2e7d8c','Repos supplémentaire'],RQ:['#8cb4e5','#1f2a44','Repos compensateur'],RN:['#8cb4e5','#1f2a44','Repos comp. de nuit'],RP:['#bcdeed','#2e7d8c','Repos périodique'],VT:['#8cb4e5','#1f2a44','Repos suppl. temps partiel'],RPS:['#bcdeed','#2e7d8c','Repos suppl. (lundi/vendredi) · 10 par an'],F:['#ffc878','#8a4b00','Jour férié'],VM:['#c9c9c9','#404040','Visite médicale'],MN:['#1f3a5f','#fff','Montée de nuit'],N1:['#17375e','#fff','N1'],N2:['#17375e','#fff','N2'],N3:['#17375e','#fff','N3'],N4:['#17375e','#fff','N4'],CS:['#d99694','#7a1f1f','Congés suppl. (mariage, naissance)'],MA:['#d99694','#7a1f1f','Maladie'],AY:['#d99694','#7a1f1f','Congé syndical'],DC:['#d99694','#7a1f1f','Grève journée complète'],DB:['#d99694','#7a1f1f','Grève 1/2 journée'],DA:['#d99694','#7a1f1f','Grève 1h'],AST:['#00ab35','#fff','Astreinte'],FOR:['#ffff69','#5c5c00','Formation']};
const AG=[['a0','HOUDAIFA Allan','hmt3','REq'],['a1','ROULLEAU Antony','hmt3'],['a2','GONCALVES FRASCO José','hmt3'],['a3','SOLARZ Christophe','hmt3'],['a4','SIME SANDJON Ethane'],['a5','DUPARC Jimmy']];
const HOL=['2027-01-01','2027-03-29','2027-05-01','2027-05-06','2027-05-08','2027-05-17','2027-07-14','2027-08-15','2027-11-01','2027-11-11','2027-12-25'];
const MOIS=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'],JS=['Di','Lu','Ma','Me','Je','Ve','Sa'];
let data={},mo=new Date().getFullYear()==2027?new Date().getMonth():0,vw='plan',sel=null,line=0,db=null,ro=false;
const iso=(m,d)=>`2027-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function get(a,k){const v=(data[a]||{})[k];if(v)return v;if(HOL.includes(k))return['F',''];const w=new Date(k+'T12:00').getDay();return w==0||w==6?['RP','']:['',''];}
function chip(c,cls,a,k,l){const h=`onclick="openS('${a}','${k}',${l})"`;if(!c)return`<span class="${cls} e" ${h}></span>`;const p=P[c]||['#ddd','#000'];return`<span class="${cls}" ${h} style="background:${p[0]};color:${p[1]}">${c}</span>`}
function name(a){return esc(a[1])+(a[2]?` <span class="h3">(${a[2]})</span>`:'')+(a[3]?`<span class="rq">(${a[3]})</span>`:'')}
function tabs(){$('tabs').innerHTML=MOIS.map((m,i)=>`<button class="${i==mo?'on':''}" onclick="mo=${i};draw()">${m.slice(0,4)}${m.length>4?'.':''}</button>`).join('');$('view').innerHTML=[['plan','Planning'],['cnt','Compteurs'],['leg','Légende']].map(([k,l])=>`<button class="${vw==k?'on':''}" onclick="vw='${k}';draw()">${l}</button>`).join('')}
function plan(){const n=new Date(2027,mo+1,0).getDate();let h='<tr><th class="nm">'+MOIS[mo]+' 2027</th>',days=[];
for(let d=1;d<=n;d++){const k=iso(mo,d),w=new Date(2027,mo,d).getDay(),c=HOL.includes(k)?'hol':(w%6==0?'we':'');days.push([k,c]);h+=`<th class="${c}">${JS[w]}<b>${d}</b></th>`}
h+='</tr>';let b='';for(const a of AG){b+=`<tr><th class="nm">${name(a)}</th>`;for(const[k,c]of days){const v=get(a[0],k);b+=`<td class="c ${c}">${chip(v[0],'a',a[0],k,0)}${chip(v[1],'b',a[0],k,1)}</td>`}b+='</tr>'}
$('main').innerHTML=`<div class="wrap"><table><thead>${h}</thead><tbody>${b}</tbody></table></div>`}
function cnt(){let o='';const dk=document.documentElement.dataset.theme=='dark';
const CC={RPS:'#1fa8bf',CA:'#3b7dd8',RU:'#14a3a3',VT:'#5b6fe0',RP:'#2aa4b8',N:dk?'#8f9cff':'#3d4fb8',AST:'#00b347',RQ:'#4a7fe0'};
const ini=a=>a[1].split(' ').filter(Boolean).map((w,i,ar)=>i==0||i==ar.length-1?w[0]:'').join('').toUpperCase();
for(const a of AG){const c={};for(let m=0;m<12;m++)for(let d=1;d<=new Date(2027,m+1,0).getDate();d++)get(a[0],iso(m,d)).forEach(x=>x&&(c[x]=(c[x]||0)+1));const g=x=>c[x]||0,N=g('N1')+g('N2')+g('N3')+g('N4');
const R=(code,lab,t)=>{const v=t-g(code),p=Math.max(0,Math.min(100,v/t*100));return`<div class="tile" style="--c:${v<0?'var(--neg)':CC[code]}"><div class="tl"><i></i>${lab}</div><div class="tv ${v<0?'neg':''}">${v}<small>/ ${t}</small></div><div class="bar"><i style="width:${p}%"></i></div></div>`};
const T=(code,lab,v)=>`<div class="tile" style="--c:${CC[code]}"><div class="tl"><i></i>${lab}</div><div class="tv">${v}</div></div>`;
o+=`<div class="card"><h3><span class="av">${ini(a)}</span><span>${name(a)}</span></h3><div class="tiles">${R('CA','CA',a[0]=='a3'?20:28)}${R('RPS','RPS',10)}${R('RU','RU',8)}${a[0]=='a3'?R('VT','VT',67):''}</div><div class="tiles t4">${T('AST','AST',g('AST'))}${T('N','Nuits',N)}${T('RQ','RQ',g('RQ'))}</div></div>`}
$('main').innerHTML=`<div class="cnt">${o}</div>`}
function leg(){$('main').innerHTML='<div class="leg">'+Object.entries(P).map(([k,p])=>`<div><span class="chip" style="background:${p[0]};color:${p[1]}">${k}</span>${p[2]}</div>`).join('')+'</div>'}
function th(t){const r=document.documentElement;if(t)r.dataset.theme=t;else delete r.dataset.theme;
const dk=t?t=='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dk?'dark':'light';
$('th').textContent=dk?'☀️ Clair':'🌙 Sombre';document.querySelector('meta[name=theme-color]').content=dk?'#0e131c':'#4a63e0'}
function tg(){const n=document.documentElement.dataset.theme=='dark'?'light':'dark';try{localStorage.setItem('tap_theme',n)}catch(e){}th(n);draw()}
(()=>{let t=null;try{t=localStorage.getItem('tap_theme')}catch(e){}th(t)})();

function openS(a,k,l){if(ro){$('st').textContent='Lecture seule : vous ne pouvez pas modifier ce planning.';return}if(l!==undefined)line=l;sel=[a,k];const ag=AG.find(x=>x[0]==a),d=+k.slice(8),n=new Date(2027,+k.slice(5,7),0).getDate();
$('sh').innerHTML=`<div class="tt"><span>${name(ag)} · ${d} ${MOIS[+k.slice(5,7)-1]}</span><button onclick="closeS()">×</button></div>
<div class="seg"><button class="${line==0?'on':''}" onclick="openS(sel[0],sel[1],0)">Ligne 1</button><button class="${line==1?'on':''}" onclick="openS(sel[0],sel[1],1)">Ligne 2</button><span style="margin-left:auto">jusqu’au <input id="to" type="number" min="${d}" max="${n}" value="${d}"></span></div>
<div class="pick">${Object.entries(P).map(([c,p])=>`<button style="background:${p[0]};color:${p[1]}" onclick="setC('${c}')"><b>${c}</b>${p[2]}</button>`).join('')}<button class="clr" onclick="setC('')"><b>✕</b>Effacer</button></div>`;$('sh').classList.add('o');$('ov').classList.add('o')}
function closeS(){$('sh').classList.remove('o');$('ov').classList.remove('o')}
function setC(c){const[a,k]=sel,m=+k.slice(5,7)-1,d0=+k.slice(8),d1=Math.max(d0,Math.min(+$('to').value||d0,new Date(2027,m+1,0).getDate()));
const mp=data[a]=data[a]||{},ks=[];for(let d=d0;d<=d1;d++){const kk=iso(m,d),v=get(a,kk).slice();v[line]=c;mp[kk]=v;ks.push(kk)}
save(a,ks);draw();closeS()}
function save(a,ks){try{localStorage.setItem('tap27_'+a,JSON.stringify(data[a]))}catch(e){}
if(db){const o={};ks.forEach(k=>o[k]=data[a][k]);const r=db.doc('planning/'+a);r.update({d:o}).catch(()=>r.set({d:data[a]})).catch(e=>$('st').textContent='Enregistrement impossible : '+(e.message||e.code))}}
AG.forEach(a=>{try{const s=localStorage.getItem('tap27_'+a[0]);if(s)data[a[0]]=JSON.parse(s)}catch(e){}});
draw();
const CFG={apiKey:"AIzaSyBz7oH7QZPduFLdQqJHr_QN6f6lh_gQM2Y",authDomain:"tap-goussainville.firebaseapp.com",databaseURL:"https://tap-goussainville-default-rtdb.europe-west1.firebasedatabase.app",projectId:"tap-goussainville",storageBucket:"tap-goussainville.firebasestorage.app",messagingSenderId:"214806325624",appId:"1:214806325624:web:46d57c2f96ba8640d7c08d"}; // ← config Firebase (Realtime Database)
const ld=u=>new Promise((r,j)=>{const e=document.createElement('script');e.src=u;e.onload=r;e.onerror=j;document.head.appendChild(e)});
(async()=>{if(!CFG.databaseURL){return}
try{const v='10.12.2';await ld(`https://www.gstatic.com/firebasejs/${v}/firebase-app-compat.js`);await ld(`https://www.gstatic.com/firebasejs/${v}/firebase-database-compat.js`);
firebase.initializeApp(CFG);const rt=firebase.database();
db={doc:p=>({update:o=>rt.ref(p+'/d').update(o.d),set:o=>rt.ref(p).set(o)})};
$('st').textContent='';
AG.forEach(a=>rt.ref('planning/'+a[0]+'/d').on('value',s=>{const v=s.val();if(v){const o={};for(const k in v){const x=v[k];o[k]=Array.isArray(x)?[x[0]||'',x[1]||'']:[(x&&x[0])||'',(x&&x[1])||'']}data[a[0]]=o;try{localStorage.setItem('tap27_'+a[0],JSON.stringify(o))}catch(e){}draw()}},()=>{$('st').textContent='⚠️ Connexion impossible : vérifiez les règles Firebase'}))}
catch(e){$('st').textContent='⚠️ Hors ligne : saisies locales uniquement'}})();
// ---- Version automatique : 1.0 au premier envoi de index.html sur GitHub, puis 1.1, 1.2... à chaque mise à jour ----
let cur=null;
function repo(){const h=location.hostname,p=location.pathname.split('/').filter(Boolean);
  if(!h.endsWith('.github.io'))return null;const o=h.replace('.github.io','');return o+'/'+(p[0]||h)}
async function nbMaj(){const r=repo();if(!r)return null;
  const res=await fetch(`https://api.github.com/repos/${r}/commits?path=index.html&per_page=1&t=${Date.now()}`,{cache:'no-store'});
  if(!res.ok)return null;const l=res.headers.get('Link')||'',m=l.match(/[?&]page=(\d+)>;\s*rel="last"/);
  return m?+m[1]:(await res.json()).length}
const vs=n=>'1.'+Math.max(0,n-1);
async function chk(){try{const n=await nbMaj();if(n===null)throw 0;
  if(cur===null){cur=n;$('ver').textContent='v'+vs(n);let o=null;try{o=localStorage.getItem('tap_vn');localStorage.setItem('tap_vn',n)}catch(e){}
    if(o&&+o<n){$('ut').textContent='Mise à jour installée : v'+vs(n);$('upd').style.display='flex';setTimeout(()=>$('upd').style.display='none',4000)}}
  else if(n>cur){$('ut').textContent='Nouvelle version v'+vs(n)+' disponible';$('upd').style.display='flex'}}
 catch(e){try{const o=localStorage.getItem('tap_vn');if(o&&cur===null)$('ver').textContent='v'+vs(+o)}catch(_){}}}
chk();document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk()});
['gesturestart','gesturechange','gestureend'].forEach(e=>document.addEventListener(e,x=>x.preventDefault(),{passive:false}));document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});let lt=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lt<300&&!e.target.closest('input'))e.preventDefault();lt=n},{passive:false});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
